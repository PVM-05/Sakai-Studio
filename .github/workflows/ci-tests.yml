name: Kiểm Thử Tự Động Giao Diện Và Luồng Xử Lý

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test-ui-and-pipeline:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONPATH: .
    steps:
      - name: Sao chép mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cài đặt thư viện kiểm thử cốt lõi
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout pytest-mock PySide6 PySide6-Fluent-Widgets opencv-python-headless numpy scipy soundfile requests tqdm Pillow filesplit imageio-ffmpeg kaldi-native-fbank huggingface_hub pydub yt-dlp

      - name: Chạy bộ kiểm thử tự động không cần GPU
        run: |
          pytest test/test_auto_pipeline_reliability.py test/test_omnivoice_improvements.py test/test_omnivoice_pipeline.py test/test_srt_translator.py test/test_subtitle_and_logo_remover.py test_home_interface.py -v --timeout=90 --durations=10
