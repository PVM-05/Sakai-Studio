events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 2048M;

    upstream backend_api {
        server backend:8000;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Bo dem cho phat luong su kien thoi gian thuc va tai video dung luong lon
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Dinh tuyen cac cong dich vu Backend FastAPI
        location ~ ^/(ytdlp|projects|tasks|extract|upload|uploads|downloads|process|status|events|detect-subtitles|docs|openapi\.json) {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ho tro truyen phat luong truc tiep khong bi chan bo dem
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # Dinh tuyen toan bo giao dien nguoi dung Frontend Next.js
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ho tro WebSocket va ket noi thoi gian thuc
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
